name: Public native npm qualification

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact public @clunkyard/cli version
        type: string
        required: true
        default: '2.1.0'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: darwin-x64
            languages: c,cpp,python,rust
          - runner: windows-latest
            platform: win32-x64
            languages: c,cpp,python,rust,csharp
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - if: runner.os == 'Windows'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Install from npm and run fresh public starters
        if: runner.os != 'Windows'
        env:
          NATIVE_CLI_VERSION: ${{ inputs.cli_version }}
          RUSTUP_TOOLCHAIN: 1.96.0
        run: node scripts/native-registry-smoke.cjs --expected-platform ${{ matrix.platform }} --languages ${{ matrix.languages }} --out "${{ runner.temp }}/native-registry"
      - name: Run ordinary MSVC, Python, Rust and .NET starters
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NATIVE_CLI_VERSION: ${{ inputs.cli_version }}
          RUSTUP_TOOLCHAIN: 1.96.0
          CC: cl
          CXX: cl
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'Install Visual Studio Build Tools with the C++ desktop tools.' }
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $variables = & cmd.exe /d /s /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Visual Studio Developer Shell setup failed.' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          node scripts/native-registry-smoke.cjs --expected-platform ${{ matrix.platform }} --languages ${{ matrix.languages }} --out "${{ runner.temp }}/native-registry"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-npm-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-registry/artifacts/
          if-no-files-found: error
