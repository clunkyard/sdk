name: Public native npm qualification

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: Exact public @clunkyard/cli version
        type: string
        required: true
        default: '2.1.0'

permissions:
  contents: read

jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Install from npm and run fresh public starters
        env:
          NATIVE_CLI_VERSION: ${{ inputs.cli_version }}
          RUSTUP_TOOLCHAIN: 1.96.0
        run: node scripts/native-registry-smoke.cjs --expected-platform darwin-x64 --languages c,cpp,python,rust --out "${{ runner.temp }}/native-registry"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: public-npm-darwin-x64
          path: ${{ runner.temp }}/native-registry/artifacts/
          if-no-files-found: error
