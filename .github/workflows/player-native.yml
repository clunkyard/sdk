name: Player native assets
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Automatically resolved qualification bundle release
        required: true
        type: string
      bundle_sha256:
        description: Automatically recorded exact input bundle digest
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: player-native-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: windows-latest
            platform: win32-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '22.0.2'
      - run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Download the exact owned qualification inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYER_RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$PLAYER_RELEASE_TAG" --repo clunkyard/sdk --pattern player-native-inputs.tar.gz --dir inputs
        shell: bash
      - name: Configure Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The native cohort requires Visual Studio C++ Build Tools.' }
          $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          $variables = & cmd.exe /d /s /c "`"$devcmd`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'Developer Shell setup failed.' }
          foreach ($line in $variables) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') { Add-Content $env:GITHUB_ENV "$($matches[1])=$($matches[2])" }
          }
          Add-Content $env:GITHUB_ENV 'CC=cl'
          Add-Content $env:GITHUB_ENV 'CXX=cl'
      - name: Build and qualify the complete advertised platform cohort
        env:
          PLAYER_BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
          PLAYER_PLATFORM: ${{ matrix.platform }}
          RUSTUP_TOOLCHAIN: 1.96.0
        run: node scripts/player-native.cjs --bundle inputs/player-native-inputs.tar.gz --out "${{ runner.temp }}/player-native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: player-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/player-native/output/
          if-no-files-found: error
