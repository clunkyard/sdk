name: Native starter qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Explicit labels distinguish Intel and Apple Silicon.
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      # This is release qualification infrastructure. The player CLI never
      # installs a compiler or changes the player's selected toolchain.
      - name: Select the core release compiler
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Pack the reviewed candidate
        run: npm run pack
      - name: Build the SDK and run fresh starter clones
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        run: node scripts/native-smoke.cjs --expected-platform ${{ matrix.platform }} --out "${{ runner.temp }}/clunkyard-native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-${{ matrix.platform }}
          path: ${{ runner.temp }}/clunkyard-native/artifacts/
          if-no-files-found: error
