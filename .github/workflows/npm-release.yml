name: Review npm packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verify_oidc:
        description: Verify npm trusted publishing without staging or publishing
        type: boolean
        default: true
      stage:
        description: Stage the qualified tarballs on npm for maintainer review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify-oidc:
    if: github.event_name == 'workflow_dispatch' && (inputs.verify_oidc || inputs.stage) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: npm-staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node scripts/verify-oidc.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-oidc-verification
          path: dist/oidc-verification.json
          if-no-files-found: error

  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-reviewed
          path: dist/
          if-no-files-found: error

  qualify:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Set project temporary directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/clunkyard-npm"
          echo "TMPDIR=$RUNNER_TEMP/clunkyard-npm" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-reviewed
          path: dist/
      - run: npm run qualify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-${{ matrix.os }}-node${{ matrix.node }}
          path: dist/qualification.json
          if-no-files-found: error

  stage:
    if: github.event_name == 'workflow_dispatch' && inputs.stage && github.ref == 'refs/heads/main'
    needs: qualify
    runs-on: ubuntu-24.04
    environment: npm-staging
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.2 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-reviewed
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualification-ubuntu-24.04-node24
          path: dist/
      - run: npm exec -- node scripts/stage.cjs --apply
